[project]
name = "openmanus-mcp"
version = "0.1.0b1"
description = "FastMCP 3.2.0 MCP + React dashboard for OpenManus (FOSS). Local LLM. Fleet onboarding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Sandra Schipal"}]
keywords = [
    "mcp",
    "fastmcp",
    "openmanus",
    "agent",
    "local-llm",
    "ollama",
    "lm-studio",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.28.0",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "psutil>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.0.0",
    "pre-commit>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/openmanus-mcp"
Repository = "https://github.com/sandraschi/openmanus-mcp"
Issues = "https://github.com/sandraschi/openmanus-mcp/issues"

[project.scripts]
openmanus-mcp = "openmanus_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmanus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
packages = ["openmanus_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
